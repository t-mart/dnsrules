# unbound makes the control socket at every start, owned root:root and closed
# to everyone else. dnsrules reloads a zone through it, so hand it to the
# unbound group. The dnsrules user is a member, from sysusers.d.
#
# The leading dash keeps unbound running if the socket is absent, which is the
# case when control-interface names a port instead of a path.
[Service]
ExecStartPost=-/usr/bin/chgrp unbound /run/unbound/control.sock
ExecStartPost=-/usr/bin/chmod 660 /run/unbound/control.sock
