[project]
name = "dnsrules"
version = "0.1.0"
description = "DNS log and control plane for unbound RPZ"
readme = "README.md"
authors = [
    { name = "Tim Martin", email = "tim@timmart.in" }
]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "django>=6.1",
    "django-htmx>=1.29.0",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "whitenoise>=6.12.0",
]

[project.scripts]
dnsrules = "dnsrules.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-tailwind-cli>=4.6.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.2",
    "ty>=0.0.71",
]

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["B", "DJ", "E", "F", "I", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "dnsrules.settings"
testpaths = ["tests"]
addopts = "--strict-markers"
