# unbound for development and for checking what the resolver actually does.
# It mirrors the parts of mace that dnsrules touches, and nothing else.

server:
    interface: 0.0.0.0
    access-control: 0.0.0.0/0 allow

    # respip is required for RPZ. The validator is left out on purpose: DNSSEC
    # needs a trust anchor and it changes nothing that dnsrules tests.
    module-config: "respip iterator"

    define-tag: "dns_privacy"
    # Tag each source exactly. unbound holds an implicit 127.0.0.0/8 entry, and
    # the longest prefix wins, so a tag on 0.0.0.0/0 never reaches loopback.
    access-control-tag: 127.0.0.1/32 "dns_privacy"
    access-control-tag: 172.16.0.0/12 "dns_privacy"

    # Queries from the docker gateway land in a view. Queries from inside the
    # container do not. Two source addresses, so one unbound tests both paths.
    access-control-view: 172.16.0.0/12 "viewed"

    chroot: ""
    username: ""
    directory: "/etc/unbound"
    use-syslog: no
    logfile: ""
    verbosity: 1

# view-first sends a query to the global local zones when the view holds no
# match. mace sets it on every view, so a global rule must reach a view client.
view:
    name: "viewed"
    view-first: yes
    local-zone: "only-in-the-view.example." always_nxdomain

# The dnsrules rules, fetched over HTTP from the site itself. First in order,
# so a passthru here beats a block in the feed below. `auth_zone_transfer
# runtime_rules` over the control interface makes unbound refetch at once.
rpz:
    name: "runtime_rules"
    url: "http://172.17.0.1:8000/rpz/home.zone"
    zonefile: "/etc/unbound/rpz-runtime-rules.zone"
    tags: "dns_privacy"
    rpz-log: yes
    rpz-log-name: "runtime_rules"
    # Clear the RA bit on a blocked answer. It is the only signal the query log
    # can read: nothing else in an answer tells a policy NXDOMAIN from a name
    # that truly does not exist.
    rpz-signal-nxdomain-ra: yes

# Stands in for the 430k entry privacy blocklist on mace. Same options.
rpz:
    name: "test_feed"
    zonefile: "/etc/unbound/rpz-test.zone"
    tags: "dns_privacy"
    rpz-log: yes
    rpz-log-name: "test_feed"
    rpz-signal-nxdomain-ra: yes

# unbound connects out to the ingest listener on the host.
dnstap:
    dnstap-enable: yes
    dnstap-ip: "172.17.0.1@6000"
    dnstap-tls: no
    dnstap-bidirectional: no
    dnstap-log-client-query-messages: yes
    dnstap-log-client-response-messages: yes

forward-zone:
    name: "."
    forward-addr: 1.1.1.1
    forward-addr: 8.8.8.8

# No certificates. Publish this port to host loopback only, never to the LAN:
# plain text control gives the resolver away to anyone who reaches it.
remote-control:
    control-enable: yes
    control-interface: 0.0.0.0
    control-use-cert: no
